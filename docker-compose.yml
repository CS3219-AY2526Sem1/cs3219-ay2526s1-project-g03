services:
  # --- DATABASES ---
  question-db-pg:
    image: postgres:14-alpine
    container_name: question-db-pg
    ports:
      - '5433:5432' 
    volumes:
      - question-data:/var/lib/postgresql/data 
      - ./question-service/db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: question-db
    networks:
      - app-network

  # --- FRONTEND ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:5173'
    environment:
      - NODE_ENV=development
      - VITE_NGROK_COLLAB_HOST=${VITE_NGROK_COLLAB_HOST}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - user-service
      - question-service
      - matching-service
      - collaboration-service
    networks:
      - app-network

  # --- BACKEND ---
  # User service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=development
      - PORT=8080
    env_file:
      - ./.env
    volumes:
      - ./user-service:/app
      - /app/node_modules
    networks:
      - app-network

  # Question service
  question-service:
    build:
      context: ./question-service
      dockerfile: Dockerfile
    ports:
      - '8083:8083'
    environment:
      - NODE_ENV=development
      - PORT=8083
    env_file:
      - ./.env
    depends_on: 
      - question-db-pg
    volumes:
      - ./question-service:/app
      - /app/node_modules
    networks:
      - app-network

  
  # Matching service
  matching-service:
    # ... (No changes needed)
    build:
      context: ./matching-service
      dockerfile: Dockerfile
    ports:
      - '8081:8081'
    environment:
      - NODE_ENV=development
      - PORT=8081
    env_file:
      - ./.env
    volumes:
      - ./matching-service:/app
      - /app/node_modules
    networks:
      - app-network

  # Collaboration service
  collaboration-service:
    platform: linux/amd64
    build:
      context: ./collaboration-service
      dockerfile: Dockerfile
    ports:
      - '8082:8082'
    environment:
      - NODE_ENV=development
      - PORT=8082
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    env_file:
      - ./.env
    volumes:
      - ./collaboration-service:/app
      - /app/node_modules
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  question-data: